<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设定编辑器 · AI 互动小说</title>
<style>
  :root{
    --bg:#0d1014; --panel:#151a21; --panel2:#1b212a; --line:#262e39;
    --fg:#d7dee6; --dim:#7d8a99; --acc:#5b9dd9; --acc2:#3b6f9e;
    --ok:#4caf7d; --warn:#d9a441; --bad:#d95b5b;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto}
  header .title{font-weight:600;letter-spacing:.5px;color:#eaf2fa;white-space:nowrap}
  header .spacer{flex:1}
  select,input[type=text],textarea,button{font-family:inherit;font-size:13px}
  select,input[type=text]{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;outline:none}
  select:focus,input:focus,textarea:focus{border-color:var(--acc2)}
  textarea{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:12px;width:100%;resize:none;outline:none;line-height:1.8}
  button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;transition:.15s;white-space:nowrap}
  button:hover{border-color:var(--acc2);color:#fff}
  button.primary{background:var(--acc2);border-color:var(--acc2);color:#fff}
  button.primary:hover{background:var(--acc)}
  button.ghost{background:transparent}
  button.sm{padding:2px 8px;font-size:12px;border-radius:4px}
  button:disabled{opacity:.45;cursor:not-allowed}

  main{display:flex;flex:1;min-height:0}
  aside{width:270px;flex:0 0 270px;border-right:1px solid var(--line);overflow-y:auto;background:var(--panel)}
  .item{padding:9px 12px;border-bottom:1px solid #1d242d;cursor:pointer}
  .item:hover{background:var(--panel2)}
  .item.active{background:var(--panel2);border-left:3px solid var(--acc);padding-left:9px}
  .item .t{font-size:13px;color:#cfe0f0}
  .item .k{font-size:11px;color:var(--dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{display:inline-block;font-size:10px;padding:0 5px;border-radius:3px;background:#2a3a4d;color:#8fc0e8;margin-left:5px;vertical-align:1px}

  section.editor{flex:1;display:flex;flex-direction:column;min-width:0;padding:12px 16px;gap:10px}
  .row{display:flex;gap:8px;align-items:center}
  .row .grow{flex:1}
  #itemTitle{font-size:15px;font-weight:600;color:#eaf2fa}
  #content{flex:1;min-height:120px}
  label.chk{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:5px;cursor:pointer}

  /* 右侧 AI 小窗口 */
  aside.ai{width:380px;flex:0 0 380px;border-left:1px solid var(--line);border-right:none;display:flex;flex-direction:column;background:var(--panel);overflow:hidden}
  .ai-head{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line)}
  .ai-head .name{font-weight:600;color:#eaf2fa;font-size:13px}
  .ai-head .spacer{flex:1}
  .chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:100%;border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.75}
  .msg.user{align-self:flex-end;background:#22303f;border:1px solid #2e4154;max-width:92%}
  .msg.ai{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
  .msg .txt{white-space:pre-wrap;word-break:break-word;max-height:260px;overflow-y:auto}
  .msg .acts{display:flex;gap:6px;margin-top:7px;align-items:center}
  .msg .acts .hint{font-size:11px;color:var(--dim);margin-right:auto}
  .msg .diff{display:none;margin-top:8px;background:#0a0d11;border:1px solid var(--line);border-radius:6px;padding:8px;font:11.5px/1.65 Consolas,monospace;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow:auto}
  .d-add{color:#7fd6a4;background:rgba(76,175,125,.10);display:block}
  .d-del{color:#e08a8a;background:rgba(217,91,91,.10);display:block}
  .d-hunk{color:#6f8ba6;display:block}
  .msg .busy{color:var(--dim);font-size:12px}
  .ai-input{border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:7px;background:var(--panel)}
  #instruction{min-height:64px;max-height:140px;resize:vertical;font-size:13px;line-height:1.6}
  .ai-input .bar{display:flex;gap:7px;align-items:center}
  .ai-input .tip{font-size:11px;color:var(--dim);flex:1}
  .empty{color:var(--dim);padding:40px 12px;text-align:center;font-size:12px;line-height:1.8}
  #status{font-size:12px;color:var(--dim);white-space:nowrap}
  .dirty{color:var(--warn)}
  .ok{color:var(--ok)} .err{color:var(--bad)}
  input[type=checkbox]{accent-color:var(--acc)}
  /* ============ 字号放大 + 可调 ============ */
  :root{ --s: 1.35; }
  body{ font-size:calc(15px * var(--s)); line-height:1.7 }
  select,input[type=text]{ font-size:calc(14px * var(--s)); padding:7px 9px }
  textarea{ font-size:calc(15px * var(--s)); line-height:1.9; padding:14px 15px }
  button{ font-size:calc(14px * var(--s)); padding:7px 13px }
  button.sm{ font-size:calc(12.5px * var(--s)) }
  #status{ font-size:calc(13px * var(--s)) }
  #itemTitle{ font-size:calc(16px * var(--s)) }
  .item{ padding:11px 13px }
  .item .t{ font-size:calc(14.5px * var(--s)) }
  .item .k{ font-size:calc(12.5px * var(--s)); margin-top:3px }
  label.chk,.row span{ font-size:calc(13px * var(--s)) }
  aside{ width:330px; flex:0 0 330px }
  aside.ai{ width:480px; flex:0 0 480px }
  .ai-head{ padding:11px 13px }
  .ai-head .name{ font-size:calc(14.5px * var(--s)) }
  .chat{ padding:14px; gap:12px }
  .msg{ font-size:calc(14.5px * var(--s)); line-height:1.85; padding:11px 13px }
  .msg .txt{ max-height:320px }
  .msg .acts .hint{ font-size:calc(12px * var(--s)) }
  .msg .diff{ font-size:calc(12.5px * var(--s)); line-height:1.7 }
  .ai-input{ padding:12px }
  #instruction{ font-size:calc(14.5px * var(--s)); min-height:76px }
  .ai-input .tip{ font-size:calc(12.5px * var(--s)) }
  .empty{ font-size:calc(13.5px * var(--s)) }
  #zVal{ font-size:calc(12px * var(--s)); color:var(--dim); min-width:42px; text-align:center }
</style>
</head>
<body>

<header>
  <span class="title">设定编辑器</span>
  <select id="kind">
    <option value="world">世界书</option>
    <option value="card">角色卡</option>
  </select>
  <select id="file"></select>
  <span class="spacer"></span>
  <span id="status">加载中…</span>
  <button id="btnReload" class="ghost">重新读取</button>
  <button id="btnSave" class="primary">保存写入</button>
</header>

<main>
  <aside id="list"></aside>

  <section class="editor">
    <div class="row">
      <span id="itemTitle">← 从左边选一个条目</span>
      <span class="grow"></span>
      <label class="chk" id="constWrap"><input type="checkbox" id="constant"> 常驻</label>
    </div>
    <div class="row" id="keysRow">
      <span style="color:var(--dim);font-size:12px">触发关键词</span>
      <input type="text" id="keys" class="grow" placeholder="用逗号分隔，例如：暖井,守井人">
    </div>
    <textarea id="content" placeholder="……"></textarea>
  </section>

  <aside class="ai">
    <div class="ai-head">
      <span class="name">AI 修改</span>
      <span class="spacer"></span>
      <button id="btnClear" class="ghost sm">清空对话</button>
    </div>
    <div id="chat" class="chat">
      <div class="empty">在下面说你想怎么改，<br>比如「把这段改短」「加一句关于气味的」<br><br>AI 只会改写你当前选中的这一条，<br>点「应用到编辑区」才会覆盖到中间的正文框。</div>
    </div>
    <div class="ai-input">
      <textarea id="instruction" placeholder="要 AI 怎么改？（Enter 发送，Shift+Enter 换行）"></textarea>
      <div class="bar">
        <span class="tip" id="tip">多轮可用：改完还能说「再短一点」</span>
        <button id="btnSend" class="primary">发送</button>
      </div>
    </div>
  </aside>
</main>

<script>
const $ = id => document.getElementById(id);
let STATE = null, CUR = null, DIRTY = false;
let CHAT = [];          // [{role, content, diff, applied}]
let SENDING = false;

function setStatus(t, cls){ $('status').textContent = t; $('status').className = cls || ''; }
function markDirty(v){ DIRTY = v; if (v) setStatus('● 有未保存的修改', 'dirty'); }
function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

async function load(){
  setStatus('读取中…');
  const r = await fetch('/api/state');
  STATE = await r.json();
  renderFiles();
  setStatus(STATE.has_key ? ('就绪 · ' + STATE.model) : '没找到 API Key', STATE.has_key ? 'ok' : 'err');
}

function currentSet(){
  const arr = $('kind').value === 'world' ? STATE.worlds : STATE.cards;
  return arr.find(x => x.file === $('file').value);
}

function renderFiles(){
  const arr = $('kind').value === 'world' ? STATE.worlds : STATE.cards;
  const sel = $('file');
  sel.innerHTML = '';
  arr.forEach(w => {
    const o = document.createElement('option');
    o.value = w.file; o.textContent = w.name;
    sel.appendChild(o);
  });
  if (arr.length) { sel.value = arr[0].file; renderList(); }
  else $('list').innerHTML = '<div class="empty">没有可编辑的文件</div>';
}

function renderList(){
  const set = currentSet(), list = $('list');
  list.innerHTML = '';
  if (!set) return;
  set.entries.forEach(e => {
    const d = document.createElement('div');
    d.className = 'item' + (CUR && CUR.id === e.id ? ' active' : '');
    const badge = e.constant ? '<span class="badge">常驻</span>' : '';
    const keys = Array.isArray(e.keys) && e.keys.length ? e.keys.join(', ') : '';
    d.innerHTML = `<div class="t">${esc(e.title)}${badge}</div><div class="k">${esc(keys)}</div>`;
    d.onclick = () => selectItem(e.id);
    list.appendChild(d);
  });
}

function selectItem(id){
  if (DIRTY && !confirm('当前有未保存的修改，确定切换？')) return;
  const set = currentSet();
  CUR = set.entries.find(e => e.id === id);
  if (!CUR) return;
  $('itemTitle').textContent = CUR.title;
  $('content').value = CUR.content || '';
  const isWorld = $('kind').value === 'world';
  $('keysRow').style.display = isWorld ? 'flex' : 'none';
  $('constWrap').style.display = isWorld ? 'flex' : 'none';
  $('constant').checked = !!CUR.constant;
  $('keys').value = (CUR.keys || []).join(', ');
  CHAT = []; renderChat();
  markDirty(false);
  setStatus('已载入：' + CUR.title);
  renderList();
}

/* ---------- 聊天面板 ---------- */
function renderChat(){
  const box = $('chat');
  box.innerHTML = '';
  if (!CHAT.length){
    box.innerHTML = '<div class="empty">在下面说你想怎么改，<br>比如「把这段改短」「加一句关于气味的」<br><br>AI 只会改写你当前选中的这一条，<br>点「应用到编辑区」才会覆盖到中间的正文框。</div>';
    return;
  }
  CHAT.forEach((m, i) => {
    const d = document.createElement('div');
    d.className = 'msg ' + (m.role === 'user' ? 'user' : 'ai');
    if (m.role === 'user'){
      d.innerHTML = `<div class="txt">${esc(m.content)}</div>`;
    } else {
      d.innerHTML = `<div class="txt">${esc(m.content)}</div>
        <div class="diff">${m.diff || ''}</div>
        <div class="acts">
          <span class="hint">${m.applied ? '已应用' : '未应用'}</span>
          <button class="sm ghost" data-diff="${i}">差异</button>
          <button class="sm primary" data-apply="${i}" ${m.applied ? 'disabled' : ''}>应用到编辑区</button>
        </div>`;
    }
    box.appendChild(d);
  });
  box.querySelectorAll('[data-apply]').forEach(b => b.onclick = () => applyOne(+b.dataset.apply));
  box.querySelectorAll('[data-diff]').forEach(b => b.onclick = () => {
    const el = b.closest('.msg').querySelector('.diff');
    el.style.display = el.style.display === 'block' ? 'none' : 'block';
  });
  box.scrollTop = box.scrollHeight;
}

function applyOne(i){
  const m = CHAT[i];
  if (!m || m.role !== 'assistant') return;
  $('content').value = m.content;
  CUR.content = m.content;
  m.applied = true;
  markDirty(true);
  renderChat();
  setStatus('已应用到编辑区，点右上「保存写入」落盘', 'dirty');
}

async function send(){
  if (SENDING) return;
  if (!CUR) return alert('先在左边选一个条目');
  const ins = $('instruction').value.trim();
  if (!ins) return;
  const current = $('content').value;
  const history = CHAT.map(m => ({ role: m.role, content: m.content }));

  CHAT.push({ role: 'user', content: ins });
  $('instruction').value = '';
  renderChat();

  SENDING = true;
  $('btnSend').disabled = true;
  $('btnSend').textContent = '生成中…';
  const busy = document.createElement('div');
  busy.className = 'msg ai busy';
  busy.textContent = '正在改写…';
  $('chat').appendChild(busy);
  $('chat').scrollTop = $('chat').scrollHeight;

  try{
    const r = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ instruction: ins, current, history })
    });
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    CHAT.push({ role: 'assistant', content: j.text, diff: j.diff, applied: false });
    setStatus('AI 给出了新版本，点「应用」才覆盖', 'dirty');
  }catch(e){
    CHAT.push({ role: 'assistant', content: '【出错】' + e.message, diff: '', applied: true });
    setStatus('AI 调用失败', 'err');
  }finally{
    SENDING = false;
    $('btnSend').disabled = false;
    $('btnSend').textContent = '发送';
    renderChat();
  }
}

$('btnSend').onclick = send;
$('instruction').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});
$('btnClear').onclick = () => { if (CHAT.length && !confirm('清空对话？编辑区内容不受影响')) return; CHAT = []; renderChat(); };

/* ---------- 编辑区同步 ---------- */
$('content').addEventListener('input', () => { if (CUR){ CUR.content = $('content').value; markDirty(true); } });
$('keys').addEventListener('input', () => {
  if (!CUR) return;
  CUR.keys = $('keys').value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
  markDirty(true);
});
$('constant').addEventListener('change', () => { if (CUR){ CUR.constant = $('constant').checked; markDirty(true); renderList(); } });
$('kind').addEventListener('change', () => { CUR = null; CHAT = []; renderChat(); renderFiles(); });
$('file').addEventListener('change', () => { CUR = null; CHAT = []; renderChat(); renderList(); });
$('btnReload').onclick = () => { if (DIRTY && !confirm('放弃未保存的修改并重新读取？')) return; load(); };

async function save(){
  const set = currentSet();
  if (!set) return;
  const btn = $('btnSave');
  btn.disabled = true; btn.textContent = '写入中…';
  try{
    const url = $('kind').value === 'world' ? '/api/save-world' : '/api/save-card';
    const r = await fetch(url, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file: set.file, entries: set.entries })
    });
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    markDirty(false);
    setStatus('✓ 已写入（' + (j.backup || 'ok') + '）· 酒馆 Ctrl+F5', 'ok');
  }catch(e){
    alert('写入失败：' + e.message);
    setStatus('写入失败', 'err');
  }finally{
    btn.disabled = false; btn.textContent = '保存写入';
  }
}
$('btnSave').onclick = save;

window.addEventListener('beforeunload', e => { if (DIRTY){ e.preventDefault(); e.returnValue = ''; } });

/* ---------- 字号调节 ---------- */
(function(){
  const KEY = 'dsh_editor_scale_v2';
  let s = parseFloat(localStorage.getItem(KEY));
  if (!isFinite(s) || s < 0.9 || s > 2.0) s = 1.35;
  function apply(){
    document.documentElement.style.setProperty('--s', s);
    const v = $('zVal'); if (v) v.textContent = Math.round(s * 100) + '%';
    try{ localStorage.setItem(KEY, s); }catch(e){}
  }
  const wrap = document.createElement('span');
  wrap.style.cssText = 'display:flex;align-items:center;gap:3px;';
  function mk(txt, d){
    const b = document.createElement('button');
    b.className = 'ghost sm'; b.textContent = txt; b.title = d < 0 ? '缩小字号' : '放大字号';
    b.onclick = () => { s = Math.min(2.0, Math.max(0.9, +(s + d).toFixed(2))); apply(); };
    return b;
  }
  const val = document.createElement('span'); val.id = 'zVal';
  const anchor = $('btnReload');
  wrap.appendChild(mk('A−', -0.1));
  wrap.appendChild(val);
  wrap.appendChild(mk('A+', 0.1));
  anchor.parentNode.insertBefore(wrap, anchor);
  apply();
})();

load();
</script>
</body>
</html>
